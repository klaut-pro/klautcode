name: publish
run-name: "build & publish ${{ inputs.version || github.event.release.tag_name }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build and publish (e.g. 1.2.3)"
        required: true
        type: string
  release:
    types: [created]

concurrency: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.version }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    if: github.repository == 'klaut-pro/klautcode'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            RELEASE="${{ github.event.release.id }}"
          else
            VERSION="${{ inputs.version }}"
            RELEASE=$(gh release view "v${VERSION}" --json databaseId --jq .databaseId --repo "${{ github.repository }}" 2>/dev/null || echo "")
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-24.04
    if: github.repository == 'klaut-pro/klautcode'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Build
        id: build
        run: |
          ./packages/klautcode/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
          ./packages/cli/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          KLAUTCODE_VERSION: ${{ needs.version.outputs.version }}
          KLAUTCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: klautcode-cli
          path: |
            packages/klautcode/dist/klautcode-darwin*
            packages/klautcode/dist/klautcode-linux*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: klautcode-cli-windows
          path: packages/klautcode/dist/klautcode-windows*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: klautcode-preview-cli
          path: packages/cli/dist/cli-*

    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-windows:
    needs:
      - build-cli
      - version
    runs-on: windows-2025
    if: github.repository == 'klaut-pro/klautcode'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: klautcode-cli-windows
          path: packages/klautcode/dist

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Azure login
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        if: env.AZURE_CLIENT_ID != ''
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-arm64\bin\klautcode.exe
            ${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-x64\bin\klautcode.exe
            ${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-x64-baseline\bin\klautcode.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-arm64\bin\klautcode.exe",
            "${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-x64\bin\klautcode.exe",
            "${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-x64-baseline\bin\klautcode.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        if: env.AZURE_CLIENT_ID != ''
        working-directory: packages/klautcode/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "klautcode-windows-arm64\bin\*" -DestinationPath "klautcode-windows-arm64.zip" -Force
          Compress-Archive -Path "klautcode-windows-x64\bin\*" -DestinationPath "klautcode-windows-x64.zip" -Force
          Compress-Archive -Path "klautcode-windows-x64-baseline\bin\*" -DestinationPath "klautcode-windows-x64-baseline.zip" -Force

      - name: Mark signed
        id: sign
        if: env.AZURE_CLIENT_ID != ''
        run: echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed Windows CLI release assets
        if: env.AZURE_CLIENT_ID != '' && needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-arm64.zip" `
            "${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-x64.zip" `
            "${{ github.workspace }}\packages\klautcode\dist\klautcode-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.AZURE_CLIENT_ID != ''
        with:
          name: klautcode-cli-signed-windows
          path: |
            packages/klautcode/dist/klautcode-windows-arm64
            packages/klautcode/dist/klautcode-windows-x64
            packages/klautcode/dist/klautcode-windows-x64-baseline

  build-electron:
    needs:
      - version
    if: github.repository == 'klaut-pro/klautcode'
    continue-on-error: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26-intel
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-26
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          # github-hosted windows runner provides the ARM64 MSVC cross-compilation toolchain
          - host: "windows-2025"
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
          - host: "windows-2025"
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: "ubuntu-24.04"
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: "ubuntu-24.04-arm"
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > $RUNNER_TEMP/apple-api-key.p8

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Azure login
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm
          sudo chmod -R a+rw ~/apt-cache

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          KLAUTCODE_VERSION: ${{ needs.version.outputs.version }}
          KLAUTCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          RUST_TARGET: ${{ matrix.settings.target }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          KLAUTCODE_VERSION: ${{ needs.version.outputs.version }}
          KLAUTCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ (github.ref_name == 'beta' && 'beta') || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}

      - name: Package
        if: needs.version.outputs.release
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          KLAUTCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_TOKEN: ${{ github.token }}
          CSC_KEYCHAIN: build.keychain
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package (no publish)
        if: ${{ !needs.version.outputs.release }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          KLAUTCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS' && needs.version.outputs.release
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="klautcode-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="klautcode-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify update metadata matches release version
        if: runner.os == 'macOS' && matrix.settings.target == 'aarch64-apple-darwin' && needs.version.outputs.release
        working-directory: packages/desktop
        run: |
          EXPECTED="${{ needs.version.outputs.version }}"
          ACTUAL=$(sed -n 's/^version: *//p' dist/latest-mac.yml | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "latest-mac.yml was not generated" >&2
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "latest-mac.yml version '$ACTUAL' does not match release version '$EXPECTED'" >&2
            echo "The app must be packaged with the release version baked in" >&2
            echo "(e.g. --config.extraMetadata.version=$EXPECTED), or auto-update" >&2
            echo "will never offer this release." >&2
            exit 1
          fi

      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\resources\klautcode-cli.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: klautcode-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.release
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-windows
      - build-electron
    # Publish whatever built: a single flaky platform (e.g. a Windows bun
    # cache race) must not block attaching the artifacts that succeeded.
    # The upload step fails loudly when nothing was built at all.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: klautcode-cli
          path: packages/klautcode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: klautcode-cli-windows
          path: packages/klautcode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.sign-cli-windows.outputs.signed == 'true'
        with:
          name: klautcode-cli-signed-windows
          path: packages/klautcode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: klautcode-preview-cli
          path: packages/cli/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        with:
          pattern: klautcode-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Upload desktop release assets
        if: needs.version.outputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(/tmp/desktop/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} /tmp/desktop/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release assets found"
            exit 1
          fi
          gh release upload "v${{ needs.version.outputs.version }}" "${files[@]}" --clobber --repo "${{ needs.version.outputs.repo }}"

      - run: ./script/publish.ts
        if: env.NODE_AUTH_TOKEN != ''
        env:
          KLAUTCODE_VERSION: ${{ needs.version.outputs.version }}
          KLAUTCODE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          LATEST_YML_DIR: /tmp/latest-yml

      - name: Finalize release
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ needs.version.outputs.version }}" --draft=false --repo "${{ needs.version.outputs.repo }}"
